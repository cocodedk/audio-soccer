name: Release APK

# Manual only, and only from main. A push trigger would re-fire on the tag this workflow
# creates; a run from another branch would tag a commit nobody reviewed, and F-Droid
# builds whatever the tag points at.
on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize rather than cancel: two concurrent runs would read the same version from
# gradle.properties and both try to release it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # shallow clones hide tags, and the version checks below need them

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Require all four signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "Missing signing secret(s):$missing — set all four (see README → Releases)." >&2
            exit 1
          fi

      - name: Read the version
        id: version
        run: |
          # gradle.properties is the only place the version is set; F-Droid's checkupdates
          # reads the same lines at each tag. Refuse to re-release a version, so a
          # forgotten bump fails here instead of overwriting nothing and confusing later.
          VERSION=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          CODE=$(sed -n 's/^VERSION_CODE=//p' gradle.properties)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Cannot parse VERSION_NAME: '$VERSION'" >&2; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released. Bump VERSION_NAME and VERSION_CODE in gradle.properties first." >&2
            exit 1
          fi
          # VERSION_CODE must be a positive integer Android accepts (at most 2100000000), and
          # must rise with every release or neither phones nor F-Droid will take the update.
          if ! [[ "$CODE" =~ ^[1-9][0-9]{0,9}$ ]] || [ "$CODE" -gt 2100000000 ]; then
            echo "VERSION_CODE must be a positive integer up to 2100000000: '$CODE'" >&2
            exit 1
          fi
          LAST=$(git tag --list 'v[0-9]*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -n "$LAST" ]; then
            LAST_CODE=$(git show "$LAST:gradle.properties" | sed -n 's/^VERSION_CODE=//p' || true)
            if ! [[ "$LAST_CODE" =~ ^[1-9][0-9]{0,9}$ ]]; then
              echo "Cannot read VERSION_CODE at the last release, $LAST: '$LAST_CODE'" >&2
              exit 1
            fi
            if [ "$CODE" -le "$LAST_CODE" ]; then
              echo "VERSION_CODE $CODE must be larger than $LAST_CODE, the code at $LAST. Bump it in gradle.properties first." >&2
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test + 100% coverage gate
        run: ./gradlew test koverVerify --no-daemon

      - name: Decode and check the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Gradle decides at configuration time whether a signing config exists, so a corrupt
          # keystore is not an error there: it quietly makes an unsigned APK, found minutes
          # later and far from the cause. Opening the keystore here fails early instead.
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          keytool -list -keystore release.keystore -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD >/dev/null || {
            echo "The keystore does not open with the KEY_ALIAS and KEYSTORE_PASSWORD secrets." >&2
            exit 1
          }

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Stage the signed APK under a stable filename
        run: |
          if ls app/build/outputs/apk/release/*-unsigned.apk >/dev/null 2>&1; then
            echo "Release APK came out unsigned — signing config did not apply"; exit 1
          fi
          src=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$src" ] || { echo "No release APK produced"; exit 1; }
          cp "$src" AudioSoccer.apk

      - name: Verify the signature and print the certificate
        run: |
          # The check that proves what is about to be published, and the one fault the keystore
          # check cannot see: a key password that differs from the store password. The digest
          # printed here is the value F-Droid's AllowedAPKSigningKeys pins.
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(find "$sdk/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$APKSIGNER" ] || { echo "apksigner not found in the Android SDK" >&2; exit 1; }
          certs=$("$APKSIGNER" verify --print-certs AudioSoccer.apk)
          printf '%s\n' "$certs"
          DIGEST=$(printf '%s\n' "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [ -n "$DIGEST" ] || { echo "apksigner printed no certificate SHA-256" >&2; exit 1; }
          echo "Signing certificate SHA-256: $DIGEST"
          printf '### Signing certificate\n\nSHA-256: %s\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f release.keystore

      # This step creates the tag as well as the release. target_commitish puts the tag on the
      # commit that was built; without it the tag lands wherever the default branch points when
      # the API call runs, and F-Droid's rebuild of the tag would not match this APK.
      - name: Create GitHub Release (tags the commit that was built)
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: AudioSoccer.apk
