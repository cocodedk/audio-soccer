name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]   # feature branches run via their PR (synchronize) — avoids double runs

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enforce 200-line file cap (CLAUDE.md rule 1)
        run: ./scripts/check-file-length.sh

      - name: Build, test, coverage gate, lint
        run: ./gradlew buildSmoke --no-daemon
