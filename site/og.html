<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audio Soccer OG image</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@900&display=swap">
<style>
  /* 1200x630 share image: night turf, chalk pitch, the ball sending sound rings toward the goal. */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #1E5A47 }
  .card { position: relative; width: 1200px; height: 630px; color: #F1F5EF;
    background: repeating-linear-gradient(90deg, #1E5A47 0 100px, #22654F 100px 200px) }
  svg { position: absolute; inset: 0 }
  .text { position: absolute; left: 72px; top: 92px; display: grid; gap: 18px; max-width: 620px }
  h1 { font: 900 150px/0.84 "Big Shoulders Display", "Arial Narrow", Impact, sans-serif; text-transform: uppercase; margin: 0 }
  h1 em { font-style: normal; color: #F5B436 }
  p { margin: 0; font: 700 38px/1.2 "Atkinson Hyperlegible", "Segoe UI", sans-serif }
  .sub { font-weight: 400; font-size: 26px; opacity: .9 }
  .url { position: absolute; left: 72px; bottom: 48px; font: 700 24px "Atkinson Hyperlegible", sans-serif; letter-spacing: .04em; opacity: .85 }
</style>
</head>
<body>
<div class="card">
  <svg viewBox="0 0 1200 630" aria-hidden="true">
    <g fill="none" stroke="#F1F5EF" stroke-width="5" opacity=".55">
      <rect x="40" y="40" width="1120" height="550"/>
      <path d="M1160 175a140 140 0 0 0 0 280"/>
      <rect x="1160" y="273" width="30" height="84"/>
    </g>
    <rect x="40" y="26" width="1120" height="14" fill="#A9C2CF" opacity=".8"/>
    <rect x="40" y="590" width="1120" height="14" fill="#A9C2CF" opacity=".8"/>
    <g fill="none" stroke="#F5B436" stroke-width="6">
      <circle cx="880" cy="400" r="58" opacity=".85"/>
      <circle cx="880" cy="400" r="104" opacity=".55"/>
      <circle cx="880" cy="400" r="156" opacity=".3"/>
    </g>
    <circle cx="880" cy="400" r="26" fill="#F5B436" stroke="#3A2600" stroke-width="4"/>
  </svg>
  <div class="text">
    <h1>Audio <em>Soccer</em></h1>
    <p>Play football by ear.</p>
    <p class="sub">A free browser trial for blind and visually impaired players. Keyboard and headphones.</p>
  </div>
  <div class="url">cocodedk.github.io/audio-soccer</div>
</div>
</body>
</html>
